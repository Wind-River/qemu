name: WR QEMU CI

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clear ccache for a fully clean build'
        type: boolean
        default: false
  push:
    branches:
      - wr-integration
  pull_request:
    branches:
      - wr-integration

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout QEMU source
        uses: actions/checkout@v4
        with:
          repository: Wind-River/qemu
          path: qemu
          # Use a specific branch or tag if needed
          # ref: wr-integration

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ hashFiles('qemu/.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Set up dependencies
        run: |
          sudo mkdir -p ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" \
            acpica-tools \
            autoconf \
            automake \
            bison \
            bzip2 \
            build-essential \
            ccache \
            cmake \
            curl \
            flex \
            git \
            lftp \
            libaio-dev \
            libcapstone-dev \
            libelf1 \
            libfdt-dev \
            libglib2.0-dev \
            libgnutls28-dev \
            libncurses5-dev \
            libpixman-1-dev \
            libslirp-dev \
            libx11-6 \
            libxext6 \
            libxpm4 \
            libz-dev \
            make \
            ninja-build \
            pylint \
            python3 \
            python3-pip \
            screen \
            socat \
            swtpm \
            texinfo \
            unzip \
            vsftpd \
            wget \
            zlib1g-dev
            
      - name: Clear ccache (if requested)
        if: ${{ github.event.inputs.clean_build == 'true' }}
        run: ccache --clear

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=1G
          ccache --zero-stats

      - name: Build QEMU
        working-directory: qemu
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ./configure --target-list="arm-softmmu,aarch64-softmmu,x86_64-softmmu" --enable-fdt --enable-plugins --enable-slirp --enable-capstone --disable-vhost-net --disable-vhost-user --enable-gnutls
          make -j$(nproc)
          make plugins
          make check-build

      - name: Print ccache stats
        run: ccache --show-stats

      - name: Set up VxWorks Sabrelite SDK
        run: |
          git clone https://${{ secrets.VXWORKS_IMAGES_TOKEN }}@github.com/hungmtruong/vxworks-images.git \
            ${{ github.workspace }}/vxworks-images

      - name: Run QEMU tests
        working-directory: qemu
        env:
          QEMU_TEST_VXWORKS_SABRELITE_SDK: ${{ github.workspace }}/vxworks-images
        run: |
          V=1 make check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-test-logs
          path: qemu/build/meson-logs/testlog.txt